# Ночная выгрузка базы (на бесплатном плане Supabase бэкапов нет). Хранится 14 дней как артефакт.
# Нужны секреты SUPABASE_DB_URL (строка подключения из Project Settings → Database, лучше Session pooler)
# и BACKUP_PASSPHRASE (длинная случайная фраза). Репозиторий публичный, артефакты может скачать любой
# вошедший в GitHub, поэтому дамп шифруется (gpg, AES-256) и без фразы не загружается вообще.
# Расшифровать: gpg -d gridline-ДАТА.dump.gpg > gridline.dump
name: Backup

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка секрета
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "SUPABASE_DB_URL или BACKUP_PASSPHRASE не задан — бэкап пропущен"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: pg_dump 17 (версия как у Supabase)
        if: steps.check.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Выгрузка и шифрование
        if: steps.check.outputs.skip != '1'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges -Fc             | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASS" -o "gridline-$stamp.dump.gpg"
          ls -la gridline-*.dump.gpg
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != '1'
        with:
          name: db-backup
          path: gridline-*.dump.gpg
          retention-days: 14
