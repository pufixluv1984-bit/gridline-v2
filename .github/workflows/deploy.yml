# main → GitHub Pages. В сборку попадают только публичные значения (правило 2).
# Миграции на боевую базу здесь НЕ применяются: только вручную через `supabase db push`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Версия сборки в журнале ошибок: по ней видно, на какой выкладке случился сбой.
          VITE_RELEASE: ${{ github.sha }}
      - run: pnpm check:bundle
      # Файлы прошлых сборок остаются на сайте 14 дней. Иначе вкладка, открытая до выкладки, или старый
      # index.html из кэша браузера (Pages отдаёт его с max-age=600) ссылаются на удалённые файлы экранов,
      # и экран падает с «Failed to fetch dynamically imported module».
      - name: Restore files of previous builds
        uses: actions/cache/restore@v4
        with:
          path: old-assets
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-
      - name: Keep previous builds' files next to the new ones
        run: |
          mkdir -p old-assets
          find old-assets -type f -mtime +14 -delete
          cp -rpn old-assets/. dist/assets/
          rm -rf old-assets
          cp -rp dist/assets old-assets
          echo "files in assets: $(ls dist/assets | wc -l)"
      - name: Save files for the next build
        uses: actions/cache/save@v4
        with:
          path: old-assets
          key: pages-assets-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
